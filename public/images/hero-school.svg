<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1f3d" />
      <stop offset="60%" stop-color="#1e3a6f" />
      <stop offset="100%" stop-color="#2d5598" />
    </linearGradient>
    <linearGradient id="bldgMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="bldgGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="roofAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#070d19" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="700" fill="url(#skyGrad)" />

  <!-- Stars / Subtle Dots -->
  <circle cx="200" cy="90" r="1.5" fill="#93c5fd" opacity="0.6" />
  <circle cx="450" cy="70" r="2" fill="#93c5fd" opacity="0.7" />
  <circle cx="780" cy="110" r="1.5" fill="#93c5fd" opacity="0.5" />
  <circle cx="1020" cy="85" r="2" fill="#93c5fd" opacity="0.6" />

  <!-- Ground / Plaza -->
  <rect y="480" width="1200" height="220" fill="url(#groundGrad)" />

  <!-- Courtyard Walkway Lines -->
  <polygon points="460,480 740,480 820,700 380,700" fill="#13223f" opacity="0.6" />
  <line x1="600" y1="480" x2="600" y2="700" stroke="#1e335b" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Main School Building Complex -->
  <!-- Left Wing -->
  <rect x="220" y="260" width="240" height="220" rx="4" fill="url(#bldgMain)" />
  <rect x="210" y="250" width="260" height="14" rx="2" fill="url(#roofAccent)" />

  <!-- Left Wing Windows -->
  <g fill="url(#bldgGlass)">
    <rect x="245" y="280" width="40" height="48" rx="2" />
    <rect x="300" y="280" width="40" height="48" rx="2" />
    <rect x="355" y="280" width="40" height="48" rx="2" />
    <rect x="410" y="280" width="35" height="48" rx="2" />

    <rect x="245" y="345" width="40" height="48" rx="2" />
    <rect x="300" y="345" width="40" height="48" rx="2" />
    <rect x="355" y="345" width="40" height="48" rx="2" />
    <rect x="410" y="345" width="35" height="48" rx="2" />

    <rect x="245" y="410" width="40" height="48" rx="2" />
    <rect x="300" y="410" width="40" height="48" rx="2" />
    <rect x="355" y="410" width="40" height="48" rx="2" />
    <rect x="410" y="410" width="35" height="48" rx="2" />
  </g>

  <!-- Right Wing -->
  <rect x="740" y="260" width="240" height="220" rx="4" fill="url(#bldgMain)" />
  <rect x="730" y="250" width="260" height="14" rx="2" fill="url(#roofAccent)" />

  <!-- Right Wing Windows -->
  <g fill="url(#bldgGlass)">
    <rect x="755" y="280" width="35" height="48" rx="2" />
    <rect x="805" y="280" width="40" height="48" rx="2" />
    <rect x="860" y="280" width="40" height="48" rx="2" />
    <rect x="915" y="280" width="40" height="48" rx="2" />

    <rect x="755" y="345" width="35" height="48" rx="2" />
    <rect x="805" y="345" width="40" height="48" rx="2" />
    <rect x="860" y="345" width="40" height="48" rx="2" />
    <rect x="915" y="345" width="40" height="48" rx="2" />

    <rect x="755" y="410" width="35" height="48" rx="2" />
    <rect x="805" y="410" width="40" height="48" rx="2" />
    <rect x="860" y="410" width="40" height="48" rx="2" />
    <rect x="915" y="410" width="40" height="48" rx="2" />
  </g>

  <!-- Central Academic Hub (Taller) -->
  <rect x="430" y="190" width="340" height="290" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="420" y="180" width="360" height="16" rx="3" fill="#0b1528" />

  <!-- Central Clock / Emblem Arch -->
  <path d="M 540 180 Q 600 130 660 180 Z" fill="#0b1528" />
  <circle cx="600" cy="165" r="16" fill="#1e335b" stroke="#f59e0b" stroke-width="2" />
  <circle cx="600" cy="165" r="3" fill="#f59e0b" />
  <line x1="600" y1="165" x2="600" y2="155" stroke="#ffffff" stroke-width="1.5" />
  <line x1="600" y1="165" x2="608" y2="165" stroke="#ffffff" stroke-width="1.5" />

  <!-- School Name Plaque on Central Facade -->
  <rect x="490" y="210" width="220" height="36" rx="6" fill="#0b1528" />
  <text x="600" y="234" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="2">142-MAKTAB</text>

  <!-- Grand Glass Atrium Windows -->
  <g fill="url(#bldgGlass)">
    <rect x="465" y="260" width="70" height="110" rx="3" />
    <rect x="545" y="260" width="110" height="110" rx="3" />
    <rect x="665" y="260" width="70" height="110" rx="3" />
  </g>

  <!-- Entrance Portico & Pillars -->
  <rect x="520" y="390" width="160" height="90" fill="#f1f5f9" />
  <rect x="510" y="380" width="180" height="12" rx="2" fill="#0b1528" />
  <rect x="530" y="392" width="12" height="88" fill="#cbd5e1" />
  <rect x="570" y="392" width="12" height="88" fill="#cbd5e1" />
  <rect x="618" y="392" width="12" height="88" fill="#cbd5e1" />
  <rect x="658" y="392" width="12" height="88" fill="#cbd5e1" />

  <!-- Main Entrance Glass Doors -->
  <rect x="585" y="420" width="30" height="60" rx="2" fill="#1e335b" />
  <line x1="600" y1="420" x2="600" y2="480" stroke="#f8fafc" stroke-width="1.5" />

  <!-- Flagpole in Front of Entrance -->
  <line x1="600" y1="360" x2="600" y2="480" stroke="#94a3b8" stroke-width="3" />
  <circle cx="600" cy="360" r="4" fill="#f59e0b" />
  <!-- Flag of Uzbekistan Colors -->
  <polygon points="600,364 645,372 600,380" fill="#0099b5" />
  <polygon points="600,380 645,388 600,396" fill="#ffffff" />
  <polygon points="600,396 645,404 600,412" fill="#1eb53a" />

  <!-- Trees & Greenery on Left and Right -->
  <g fill="#059669">
    <ellipse cx="140" cy="460" rx="45" ry="70" />
    <ellipse cx="180" cy="470" rx="35" ry="55" />
    <ellipse cx="1060" cy="460" rx="45" ry="70" />
    <ellipse cx="1020" cy="470" rx="35" ry="55" />
  </g>
  <g fill="#047857">
    <ellipse cx="140" cy="445" rx="35" ry="50" />
    <ellipse cx="1060" cy="445" rx="35" ry="50" />
  </g>
  <rect x="135" y="490" width="10" height="40" fill="#78350f" />
  <rect x="1055" y="490" width="10" height="40" fill="#78350f" />

  <!-- Architectural Lighting Glows -->
  <circle cx="600" cy="420" r="18" fill="#fbbf24" opacity="0.15" />
</svg>
