<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#libBg)" />

  <!-- Bookshelves in Background -->
  <g fill="#334155">
    <rect x="60" y="80" width="680" height="12" />
    <rect x="60" y="180" width="680" height="12" />
    <rect x="60" y="280" width="680" height="12" />
  </g>

  <!-- Books on shelves -->
  <!-- Shelf 1 -->
  <g>
    <rect x="90" y="92" width="18" height="88" fill="#3b82f6" rx="2" />
    <rect x="110" y="100" width="22" height="80" fill="#f59e0b" rx="2" />
    <rect x="134" y="90" width="16" height="90" fill="#10b981" rx="2" />
    <rect x="152" y="105" width="24" height="75" fill="#ef4444" rx="2" />
    <rect x="178" y="95" width="20" height="85" fill="#8b5cf6" rx="2" />
    <rect x="200" y="92" width="22" height="88" fill="#3b82f6" rx="2" />

    <rect x="260" y="95" width="20" height="85" fill="#64748b" rx="2" />
    <rect x="282" y="90" width="24" height="90" fill="#f59e0b" rx="2" />
    <rect x="308" y="102" width="18" height="78" fill="#10b981" rx="2" />

    <rect x="540" y="92" width="22" height="88" fill="#14b8a6" rx="2" />
    <rect x="564" y="98" width="18" height="82" fill="#ec4899" rx="2" />
    <rect x="584" y="90" width="25" height="90" fill="#3b82f6" rx="2" />
    <rect x="611" y="95" width="20" height="85" fill="#eab308" rx="2" />
  </g>

  <!-- Shelf 2 -->
  <g>
    <rect x="90" y="192" width="24" height="88" fill="#8b5cf6" rx="2" />
    <rect x="116" y="200" width="18" height="80" fill="#10b981" rx="2" />
    <rect x="136" y="192" width="26" height="88" fill="#f59e0b" rx="2" />
    <rect x="164" y="205" width="20" height="75" fill="#3b82f6" rx="2" />

    <rect x="420" y="192" width="25" height="88" fill="#ef4444" rx="2" />
    <rect x="447" y="196" width="18" height="84" fill="#3b82f6" rx="2" />
    <rect x="467" y="192" width="22" height="88" fill="#10b981" rx="2" />
  </g>

  <!-- Reading Table and Lamp in Foreground -->
  <rect x="160" y="340" width="480" height="80" rx="4" fill="#1e3a5f" stroke="#2563eb" stroke-width="2" />
  <!-- Table Legs -->
  <rect x="190" y="420" width="16" height="80" fill="#0f172a" />
  <rect x="594" y="420" width="16" height="80" fill="#0f172a" />

  <!-- Study Lamp -->
  <path d="M 370 340 L 370 290 Q 370 270 390 270 L 410 270" stroke="#f59e0b" stroke-width="4" fill="none" />
  <path d="M 400 260 L 430 270 L 415 285 Z" fill="#f59e0b" />
  <polygon points="410,285 460,350 370,350" fill="#fbbf24" opacity="0.15" />

  <!-- Laptop / Open Book on Desk -->
  <polygon points="340,350 460,350 480,380 320,380" fill="#e2e8f0" />
  <rect x="350" y="310" width="100" height="40" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <rect x="355" y="315" width="90" height="30" fill="#38bdf8" opacity="0.8" />

  <!-- Tag Pill -->
  <rect x="290" y="435" width="220" height="36" rx="18" fill="#1e335b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="400" y="458" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="1">ZAMONAVIY KUTUBXONA</text>
