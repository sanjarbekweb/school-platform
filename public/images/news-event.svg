<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="eventBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#eventBg)" />

  <!-- Confetti / Festive Circles & Stars -->
  <circle cx="120" cy="100" r="8" fill="#f59e0b" opacity="0.8" />
  <circle cx="220" cy="180" r="5" fill="#ec4899" opacity="0.8" />
  <circle cx="310" cy="90" r="10" fill="#3b82f6" opacity="0.8" />
  <circle cx="680" cy="120" r="8" fill="#10b981" opacity="0.8" />
  <circle cx="590" cy="170" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="710" cy="240" r="9" fill="#8b5cf6" opacity="0.8" />
  <rect x="150" y="220" width="12" height="12" rx="2" fill="#3b82f6" transform="rotate(25)" />
  <rect x="630" y="270" width="14" height="14" rx="3" fill="#f43f5e" transform="rotate(40)" />

  <!-- Stage Curtains / Banner -->
  <g transform="translate(400, 230)">
    <!-- Festivity Ribbons / Laurel -->
    <circle cx="0" cy="0" r="95" fill="#4338ca" stroke="#818cf8" stroke-width="3" />
    <circle cx="0" cy="0" r="80" fill="#1e1b4b" />

    <!-- Stage Spotlight Star -->
    <polygon points="0,-45 12,-15 45,-15 18,8 28,40 0,20 -28,40 -18,8 -45,-15 -12,-15" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <circle cx="0" cy="0" r="12" fill="#ffffff" />
  </g>

  <!-- Tag Pill -->
  <rect x="260" y="410" width="280" height="38" rx="19" fill="#6366f1" />
  <text x="400" y="434" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">TADBIRLAR VA BAYRAMLAR</text>
</svg>
