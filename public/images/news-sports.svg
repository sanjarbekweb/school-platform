<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sportBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sportBg)" />

  <!-- Running Track Curved Lines -->
  <g fill="none" stroke="#10b981" stroke-width="2" opacity="0.3">
    <circle cx="400" cy="550" r="380" />
    <circle cx="400" cy="550" r="420" />
    <circle cx="400" cy="550" r="460" />
  </g>

  <!-- Trophy and Medal Centerpiece -->
  <g transform="translate(400, 220)">
    <!-- Shield / Badge -->
    <path d="M 0 -90 L 80 -60 L 80 20 C 80 80 0 110 0 110 C 0 110 -80 80 -80 20 L -80 -60 Z" fill="#047857" stroke="#34d399" stroke-width="3" />
    <!-- Cup -->
    <path d="M -35 -40 L 35 -40 L 30 15 C 28 35 15 45 0 45 C -15 45 -28 35 -30 15 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <!-- Cup Handles -->
    <path d="M -35 -30 C -55 -30 -55 5 -30 10" fill="none" stroke="#fbbf24" stroke-width="3" />
    <path d="M 35 -30 C 55 -30 55 5 30 10" fill="none" stroke="#fbbf24" stroke-width="3" />
    <!-- Cup Stem & Base -->
    <rect x="-6" y="45" width="12" height="20" fill="#fbbf24" />
    <rect x="-24" y="65" width="48" height="12" rx="2" fill="#d97706" />
    <!-- Star on Cup -->
    <polygon points="0,-18 4,-8 14,-8 6,-1 9,9 0,3 -9,9 -6,-1 -14,-8 -4,-8" fill="#ffffff" />
  </g>

  <!-- Tag Pill -->
  <rect x="275" y="410" width="250" height="38" rx="19" fill="#059669" />
  <text x="400" y="434" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">SPORT MUSOBAQALARI</text>
</svg>
